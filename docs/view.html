<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マニュアル</title>
<link rel="stylesheet" href="style.css?v=20261126b">
</head>
<body>
<header class="bar">
  <a href="index.html">‹ 一覧</a>
  <h1 id="title">読み込み中…</h1>
  <a id="editLink" class="hidden" style="font-size:14px">編集</a>
  <select id="lang" style="width:auto;padding:6px 8px;font-size:14px"></select>
</header>
<main>
  <div id="gate" class="hidden"></div>
  <div id="content" class="hidden">
  <div id="whoBox" class="card hidden">
    <label class="field" style="margin:0">
      <span>あなたの名前を選んでください（見た記録に使います）</span>
      <select id="staff"></select>
    </label>
  </div>

  <div id="metaLine" style="margin:0 0 8px"></div>
  <div id="videoArea">
  <div class="player-wrap"><div id="player"></div></div>
  <div class="progress" style="margin-top:8px"><div id="bar"></div></div>
  <p class="muted" id="watchInfo" style="margin:4px 0 0">見た割合 0%</p>

  <div class="sub-box">
    <div class="text" id="sub">&nbsp;</div>
    <button class="small" id="reportBtn" title="字幕のまちがいを知らせる">報告</button>
  </div>
  <div id="reportBox" class="card hidden">
    <label class="field"><span>どこがおかしいですか？</span><textarea id="reportNote"></textarea></label>
    <div class="row"><button class="primary" id="reportSend">送る</button><button id="reportCancel">やめる</button></div>
  </div>
  </div>

  <!-- 写真・レシピのとき -->
  <div id="recipeArea" class="hidden">
    <img id="recipeCover" class="recipe-cover hidden" alt="">
    <div class="card" id="ingrCard" style="margin-top:14px">
      <h2>材料</h2>
      <div class="yield-row hidden" id="yieldRow">
        <input type="text" inputmode="decimal" id="yieldInput"><span id="yieldUnit"></span>
        <span class="muted" style="font-size:13px" id="yieldNote"></span>
      </div>
      <table class="ingr" id="ingrTable"></table>
    </div>
  </div>

  <h2 style="font-size:16px;margin:18px 0 8px">手順</h2>
  <ol class="steps" id="steps"></ol>
  <div class="card hidden" id="bodyCard" style="margin-top:14px"><h2>補足</h2><div class="body-text" id="bodyText"></div></div>

  <div class="card" id="quizCard" style="margin-top:18px">
    <h2>確認テスト</h2>
    <div id="quiz"></div>
    <p id="quizResult" class="muted"></p>
  </div>

  <div class="card">
    <button class="primary" id="confirmBtn" style="width:100%">確認しました</button>
    <p class="muted" id="confirmMsg" style="margin:8px 0 0"></p>
  </div>
  </div>
</main>

<script src="config.js?v=20261126b"></script>
<script src="common.js?v=20261126b"></script>
<script>
(async function () {
  const id = FM.qs('id');
  const sessionId = FM.uid();
  let manual, player, lang = 'ja';
  let staff = '', me;

  // 視聴の記録
  const track = { watchedSec: 0, duration: 0, maxPos: 0, completed: false, stepViews: {}, confirmed: false };
  let quizScore, quizTotal;
  let lastT = null, lastStep = -1, lastSub = -2, dirty = false;

  function logNow(useBeacon) {
    if (!manual) return;
    const params = Object.assign({ sessionId, manualId: id, staff }, track, { quizScore, quizTotal });
    if (useBeacon) FM.beacon('log', params);
    else FM.api('log', params).catch(() => {});
    dirty = false;
  }

  try {
    me = await FM.ready(document.getElementById('gate'), [['get', { id }]]);
  } catch (e) {
    document.getElementById('title').textContent = '開けませんでした';
    FM.toast(e.message, true);
    return;
  }
  staff = me.name || '';
  document.getElementById('content').classList.remove('hidden');

  try {
    manual = await FM.api('get', { id });
  } catch (e) {
    document.getElementById('title').textContent = '開けませんでした';
    FM.toast(e.message, true);
    return;
  }
  document.title = manual.title;
  document.getElementById('title').textContent = manual.title;
  document.getElementById('metaLine').innerHTML =
    `<span class="chip-store">${FM.esc(manual.store)}</span>` +
    (manual.folder ? `<span class="muted" style="font-size:13px">📁 ${FM.esc(manual.folder)}</span> ` : '') +
    `<div>${FM.tagsHtml(manual.tags)}</div>`;
  // タグを押したら、一覧でそのタグを検索
  document.getElementById('metaLine').addEventListener('click', e => {
    const t = e.target.closest('.tag'); if (!t) return;
    location.href = 'index.html#' + encodeURIComponent('#' + t.dataset.tag);
  });
  // 編集ボタン：管理者と、その店舗の責任者だけ
  const es = me.editStores || (me.canEdit ? ['*'] : []);
  if (es.indexOf('*') >= 0 || es.indexOf(manual.store) >= 0) {
    const el = document.getElementById('editLink');
    el.href = 'edit.html?id=' + encodeURIComponent(id);
    el.classList.remove('hidden');
  }

  // 言語
  const langSel = document.getElementById('lang');
  const hasLang = l => manual.subs.some(s => s.text[l]) || manual.steps.some(s => s.title[l]);
  const avail = manual.langs.filter((l, i) => i === 0 || hasLang(l));
  lang = avail.indexOf(FM.store.get('lang', 'ja')) >= 0 ? FM.store.get('lang', 'ja') : avail[0];
  langSel.innerHTML = avail.map(l => `<option value="${l}" ${l === lang ? 'selected' : ''}>${FM.esc(manual.langNames[l] || l)}</option>`).join('');
  if (avail.length < 2) langSel.classList.add('hidden');
  langSel.onchange = () => { lang = langSel.value; FM.store.set('lang', lang); renderSteps(); lastSub = -2; };
  const pick = (obj) => (obj && (obj[lang] || obj[manual.langs[0]])) || '';

  // 名前（ブラウザで名前を選ぶ方式のときだけ）
  if (me.mode === 'legacy' && !staff) {
    const box = document.getElementById('whoBox');
    const sel = document.getElementById('staff');
    box.classList.remove('hidden');
    sel.innerHTML = '<option value="">選んでください</option>' + (me.candidates || []).map(n => `<option>${FM.esc(n)}</option>`).join('');
    sel.onchange = () => { staff = sel.value; FM.store.set('staff', staff); if (staff) box.classList.add('hidden'); dirty = true; };
  }

  // 手順
  const stepsEl = document.getElementById('steps');
  function renderSteps() {
    const isRecipe = manual.type === 'recipe';
    stepsEl.classList.toggle('recipe', isRecipe);
    stepsEl.innerHTML = manual.steps.map((s, i) => `
      <li data-i="${i}">
        <div class="num">${i + 1}</div>
        <div class="grow">
          <div class="t">${FM.esc(pick(s.title))}${isRecipe ? '' : `<span class="time">${FM.fmtTime(s.start)}</span>`}</div>
          <div class="d">${FM.esc(pick(s.desc))}</div>
          ${isRecipe && s.image ? `<img class="step-photo" data-photo="${FM.esc(s.image)}" alt="">` : ''}
        </div>
      </li>`).join('');
    if (isRecipe) FM.loadPhotos(stepsEl);
    highlight(lastStep, false);
  }
  stepsEl.addEventListener('click', e => {
    const li = e.target.closest('li');
    if (!li || !player || !player.seekTo) return;
    const s = manual.steps[Number(li.dataset.i)];
    player.seekTo(s.start, true);
    player.playVideo();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  function highlight(i, scroll) {
    stepsEl.querySelectorAll('li').forEach((li, k) => li.classList.toggle('active', k === i));
  }
  renderSteps();

  // テスト
  const quizEl = document.getElementById('quiz');
  if (!manual.quiz.length) document.getElementById('quizCard').classList.add('hidden');
  const answers = {};
  quizEl.innerHTML = manual.quiz.map((q, qi) => `
    <div class="quiz-q" data-q="${qi}">
      <div><strong>Q${qi + 1}.</strong> ${FM.esc(q.question)}</div>
      <div class="choices">${q.choices.map((c, ci) => `<button data-c="${ci}">${FM.esc(c)}</button>`).join('')}</div>
    </div>`).join('');
  quizEl.addEventListener('click', e => {
    const b = e.target.closest('button[data-c]');
    if (!b) return;
    const box = b.closest('.quiz-q');
    const qi = Number(box.dataset.q);
    if (answers[qi] !== undefined) return;
    const ci = Number(b.dataset.c);
    answers[qi] = ci;
    const correct = manual.quiz[qi].answer;
    box.querySelectorAll('button').forEach((x, k) => {
      if (k === correct) x.classList.add('correct');
      else if (k === ci) x.classList.add('wrong');
      x.disabled = true;
    });
    if (Object.keys(answers).length === manual.quiz.length) {
      quizTotal = manual.quiz.length;
      quizScore = manual.quiz.filter((q, k) => answers[k] === q.answer).length;
      document.getElementById('quizResult').textContent = `${quizTotal}問中 ${quizScore}問 正解`;
      logNow();
    }
  });

  // 確認ボタン
  document.getElementById('confirmBtn').onclick = async () => {
    if (!staff) { FM.toast('先に名前を選んでください', true); window.scrollTo({ top: 0 }); return; }
    const btn = document.getElementById('confirmBtn');
    btn.disabled = true;
    btn.textContent = '記録しています…';
    track.confirmed = true;
    if (manual.type === 'recipe') track.completed = true;
    if (player && player.pauseVideo) player.pauseVideo();
    try {
      await FM.api('log', Object.assign({ sessionId, manualId: id, staff }, track, { quizScore, quizTotal }));
      dirty = false;
      document.getElementById('confirmMsg').textContent = '記録しました。おつかれさまでした。一覧に戻ります…';
      setTimeout(() => { location.href = 'index.html'; }, 1200);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '確認しました';
      FM.toast('記録できませんでした。もう一度押してください', true);
    }
  };

  // 字幕の報告
  const reportBox = document.getElementById('reportBox');
  let reportIdx = -1;
  document.getElementById('reportBtn').onclick = () => {
    reportIdx = lastSub;
    if (player && player.pauseVideo) player.pauseVideo();
    reportBox.classList.remove('hidden');
    document.getElementById('reportNote').focus();
  };
  document.getElementById('reportCancel').onclick = () => reportBox.classList.add('hidden');
  document.getElementById('reportSend').onclick = async () => {
    const note = document.getElementById('reportNote').value.trim();
    if (!note) return;
    try {
      await FM.api('report', { manualId: id, staff, subIdx: reportIdx, note });
      FM.toast('送りました。ありがとうございます');
      document.getElementById('reportNote').value = '';
      reportBox.classList.add('hidden');
    } catch (e) { FM.toast(e.message, true); }
  };

  // 写真・レシピ
  if (manual.type === 'recipe') {
    document.getElementById('videoArea').classList.add('hidden');
    document.getElementById('recipeArea').classList.remove('hidden');
    if (manual.cover) {
      const c = document.getElementById('recipeCover');
      c.setAttribute('data-photo', manual.cover); c.classList.remove('hidden'); FM.loadPhotos(c.parentNode);
    }
    const baseQty = Number(manual.yieldQty) || 0;
    const ingrTable = document.getElementById('ingrTable');
    const renderIngr = ratio => {
      let lastGroup = null;
      ingrTable.innerHTML = manual.ingredients.map(g => {
        let head = '';
        if (g.group && g.group !== lastGroup) head = `<tr class="grp"><td colspan="3">${FM.esc(g.group)}</td></tr>`;
        lastGroup = g.group;
        return head + `<tr><td>${FM.esc(g.name)}${g.note ? `<div class="note">${FM.esc(g.note)}</div>` : ''}</td>
          <td class="amt">${FM.esc(FM.scaleAmount(g.amount, ratio))}</td><td>${FM.esc(g.unit)}</td></tr>`;
      }).join('');
    };
    if (!manual.ingredients.length) document.getElementById('ingrCard').classList.add('hidden');
    renderIngr(1);
    if (baseQty) {
      document.getElementById('yieldRow').classList.remove('hidden');
      const inp = document.getElementById('yieldInput');
      inp.value = manual.yieldQty;
      document.getElementById('yieldUnit').textContent = manual.yieldUnit;
      document.getElementById('yieldNote').textContent = '数を変えると分量も変わります';
      inp.addEventListener('input', () => { const v = Number(inp.value); renderIngr(v > 0 ? v / baseQty : 1); });
    }
    if (manual.body) {
      document.getElementById('bodyText').textContent = manual.body;
      document.getElementById('bodyCard').classList.remove('hidden');
    }
    // レシピは「確認しました」で完了扱い
    window.addEventListener('pagehide', () => logNow(true));
    logNow();
    return;
  }

  // 動画
  if (!manual.youtubeId) {
    document.getElementById('player').outerHTML = '<div style="color:#fff;display:flex;align-items:center;justify-content:center">動画がまだ登録されていません</div>';
    return;
  }
  const YT = await FM.loadYouTube();
  player = new YT.Player('player', {
    videoId: manual.youtubeId,
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1, cc_load_policy: 0 },
    events: {
      onStateChange: ev => {
        if (ev.data === YT.PlayerState.PAUSED || ev.data === YT.PlayerState.ENDED) logNow();
      }
    }
  });

  const subEl = document.getElementById('sub');
  setInterval(() => {
    if (!player || !player.getCurrentTime) return;
    const t = player.getCurrentTime() || 0;
    const playing = player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING;
    track.duration = player.getDuration() || track.duration;

    if (playing && lastT !== null) {
      const d = t - lastT;
      if (d > 0 && d <= 1.5) { track.watchedSec += d; dirty = true; } // 飛ばした分は数えない
    }
    lastT = t;
    track.maxPos = Math.max(track.maxPos, t);
    if (track.duration && track.watchedSec >= track.duration * 0.9 && !track.completed) {
      track.completed = true; dirty = true; logNow();
    }

    const si = FM.indexAt(manual.steps, t, false);
    if (si !== lastStep) {
      if (playing && si >= 0) { track.stepViews[si] = (track.stepViews[si] || 0) + 1; dirty = true; }
      lastStep = si;
      highlight(si, true);
    }
    const ui = FM.indexAt(manual.subs, t, true);
    if (ui !== lastSub) {
      lastSub = ui;
      subEl.textContent = ui >= 0 ? pick(manual.subs[ui].text) : ' ';
    }

    const pct = track.duration ? Math.min(100, Math.round(track.watchedSec / track.duration * 100)) : 0;
    document.getElementById('bar').style.width = pct + '%';
    document.getElementById('watchInfo').textContent = '見た割合 ' + pct + '%' + (track.completed ? '（最後まで見ました）' : '');
  }, 500);

  setInterval(() => { if (dirty) logNow(); }, 15000);
  window.addEventListener('pagehide', () => logNow(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && dirty) logNow(true); });
})();
</script>
</body>
</html>
