<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLAT マニュアル</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <h1>FLAT マニュアル</h1>
  <a href="admin.html" id="adminLink" class="hidden">管理</a>
</header>
<main>
  <div id="gate" class="hidden"></div>

  <div id="content" class="hidden">
    <!-- ブラウザで名前を選ぶ方式のとき -->
    <div class="card hidden" id="pickCard">
      <label class="field" style="margin:0">
        <span>あなたの名前</span>
        <select id="staff"></select>
      </label>
      <p class="muted" style="margin:6px 0 0">見た記録に使います。次回からは自動で選ばれます。</p>
    </div>
    <!-- LINEで本人確認できているとき -->
    <p class="muted hidden" id="whoLine"></p>

    <div id="list" class="list"><p class="muted">読み込み中…</p></div>
  </div>
  <p class="muted" id="loading">読み込み中…</p>
</main>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  let me;
  try {
    me = await FM.ready($('gate'));
  } catch (e) {
    $('loading').textContent = '読み込めませんでした：' + e.message;
    return;
  }
  $('loading').classList.add('hidden');
  $('content').classList.remove('hidden');

  // 管理リンクは、LINEで開いたスタッフには出さない
  if (me.mode !== 'line') $('adminLink').classList.remove('hidden');

  if (me.mode === 'legacy') {
    const sel = $('staff');
    $('pickCard').classList.remove('hidden');
    sel.innerHTML = '<option value="">選んでください</option>' +
      (me.candidates || []).map(n => `<option ${n === me.name ? 'selected' : ''}>${FM.esc(n)}</option>`).join('');
    sel.addEventListener('change', () => FM.store.set('staff', sel.value));
  } else {
    $('whoLine').textContent = me.mode === 'admin' ? '管理者として表示しています（記録は「管理者」になります）' : me.name + ' さん';
    $('whoLine').classList.remove('hidden');
  }

  try {
    const list = await FM.api('list');
    const box = $('list');
    if (!list.length) {
      box.innerHTML = '<p class="muted">公開中のマニュアルはまだありません。</p>';
      return;
    }
    box.innerHTML = list.map(m => `
      <a class="item" href="view.html?id=${encodeURIComponent(m.id)}">
        ${m.youtubeId ? `<img class="thumb" src="https://i.ytimg.com/vi/${FM.esc(m.youtubeId)}/mqdefault.jpg" alt="">` : '<div class="thumb"></div>'}
        <div class="grow"><strong>${FM.esc(m.title)}</strong></div>
      </a>`).join('');
  } catch (e) {
    $('list').innerHTML = `<p class="muted">読み込めませんでした：${FM.esc(e.message)}</p>`;
  }
})();
</script>
</body>
</html>
