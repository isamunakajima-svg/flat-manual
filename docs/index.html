<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLAT マニュアル</title>
<script>
// LINEの通知から開いたとき（?liff.state=/edit.html?id=…）は、ほかの処理より先に目的のページへ移る
(function () {
  try {
    var st = new URLSearchParams(location.search).get('liff.state');
    var m = st && st.match(/([a-z]+\.html(?:\?[^#]*)?)/);
    if (m && m[1].indexOf('index.html') !== 0) {
      location.replace(location.pathname.replace(/[^/]*$/, '') + m[1] + location.hash);
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css?v=20261126f">
</head>
<body>
<header class="bar">
  <h1>FLAT マニュアル</h1>
  <a href="admin.html" id="adminLink" class="hidden">管理</a>
</header>
<main>
  <div id="gate" class="hidden"></div>

  <div id="content" class="hidden">
    <!-- フォルダのタブ -->
    <nav class="tabbar" id="folderTabs"></nav>
    <p class="muted hidden" id="dragHint" style="margin:-6px 0 8px;font-size:13px">フォルダ名を長押しして横にずらすと、自分用に並べ替えられます。</p>
    <!-- ブラウザで名前を選ぶ方式のとき -->
    <div class="card hidden" id="pickCard">
      <label class="field" style="margin:0">
        <span>あなたの名前</span>
        <select id="staff"></select>
      </label>
      <p class="muted" style="margin:6px 0 0">見た記録に使います。次回からは自動で選ばれます。</p>
    </div>
    <!-- LINEで本人確認できているとき -->
    <p class="muted hidden" id="whoLine" style="margin:0 0 8px"></p>

    <div class="card" style="padding:10px">
      <input type="text" id="q" placeholder="検索（タイトル・#タグ・フォルダ）">
      <div class="filters" id="storeRow">
        <select id="fStore"><option value="">すべての店舗</option></select>
      </div>
    </div>

    <div id="list" class="list"><p class="muted">読み込み中…</p></div>
  </div>
  <p class="muted" id="loading">読み込み中…</p>
</main>

<script src="config.js?v=20261126f"></script>
<script src="common.js?v=20261126f"></script>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  let me;
  try {
    me = await FM.ready($('gate'), [['list'], ['meta']]);
  } catch (e) {
    $('loading').textContent = '読み込めませんでした：' + e.message;
    return;
  }
  $('loading').classList.add('hidden');
  $('content').classList.remove('hidden');

  // 管理リンクは、管理者と店舗責任者だけに出す
  if (me.mode !== 'line' || me.canEdit) $('adminLink').classList.remove('hidden');

  if (me.mode === 'legacy') {
    const sel = $('staff');
    $('pickCard').classList.remove('hidden');
    sel.innerHTML = '<option value="">選んでください</option>' +
      (me.candidates || []).map(n => `<option ${n === me.name ? 'selected' : ''}>${FM.esc(n)}</option>`).join('');
    sel.addEventListener('change', () => FM.store.set('staff', sel.value));
  } else {
    $('whoLine').textContent = me.mode === 'admin' ? '管理者として表示しています（記録は「管理者」になります）' : me.name + ' さん';
    $('whoLine').classList.remove('hidden');
  }

  let list = [], meta = { stores: [], folders: [] };
  try {
    [list, meta] = await Promise.all([FM.api('list'), FM.api('meta').catch(() => ({ stores: [], folders: [] }))]);
  } catch (e) {
    $('list').innerHTML = `<p class="muted">読み込めませんでした：${FM.esc(e.message)}</p>`;
    return;
  }

  // 絞り込みの選択肢（実際にマニュアルがあるものだけ）
  const used = (key) => Array.from(new Set(list.map(m => m[key]).filter(x => x)));
  const order = (names, ref) => names.sort((a, b) => {
    const ia = ref.indexOf(a), ib = ref.indexOf(b);
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b, 'ja');
  });
  const stores = order(used('store'), meta.stores);
  let folders = order(used('folder'), meta.folders);
  // 自分で並べたフォルダの順（LINEの人はサーバーに、管理パスワードの端末はこの端末に保存）
  let myOrder = (me.folderOrder && me.folderOrder.length) ? me.folderOrder : FM.store.get('folderOrder', []);
  const applyMyOrder = () => {
    const pos = f => { const i = myOrder.indexOf(f); return i >= 0 ? i : 1000 + folders.indexOf(f); };
    folders = folders.slice().sort((a, b) => pos(a) - pos(b));
  };
  applyMyOrder();
  $('fStore').innerHTML += stores.map(s => `<option>${FM.esc(s)}</option>`).join('');
  if (stores.length < 2) $('storeRow').classList.add('hidden');
  // フォルダのタブ（'' = すべて、'__none' = フォルダなし）。前回選んだものを覚えておく
  let curFolder = FM.store.get('fFolder', '');
  if (curFolder && curFolder !== '__none' && folders.indexOf(curFolder) < 0) curFolder = '';
  $('fStore').value = FM.store.get('fStore', '');
  if ($('fStore').value !== FM.store.get('fStore', '')) $('fStore').value = '';

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const words = q.split(/\s+/).filter(w => w).map(w => w.replace(/^[#＃]/, ''));
    const fs = $('fStore').value;
    // 店舗と検索で絞ったもの（タブの件数はこれで数える）
    const base = list.filter(m => {
      if (fs && m.store !== fs) return false;
      const hay = [m.title, m.folder, m.store].concat(m.tags || []).join(' ').toLowerCase();
      return words.every(w => hay.indexOf(w) >= 0);
    });
    const count = f => base.filter(m => f === '' ? true : f === '__none' ? !m.folder : m.folder === f).length;
    const tabs = [['', 'すべて']].concat(folders.map(f => [f, f]));
    if (list.some(m => !m.folder)) tabs.push(['__none', 'フォルダなし']);
    $('folderTabs').innerHTML = tabs.map(([v, l]) =>
      `<button data-folder="${FM.esc(v)}" class="${v === curFolder ? 'on' : ''}${v && v !== '__none' ? ' movable' : ''}">${FM.esc(l)}<span class="n">${count(v)}</span></button>`).join('');
    $('dragHint').classList.toggle('hidden', folders.length < 2 || FM.store.get('dragHintSeen', false));

    if (!list.length) { $('list').innerHTML = '<p class="muted">公開中のマニュアルはまだありません。</p>'; return; }
    const hit = base.filter(m => curFolder === '' ? true : curFolder === '__none' ? !m.folder : m.folder === curFolder);
    if (!hit.length) {
      $('list').innerHTML = base.length && curFolder
        ? `<p class="muted">このフォルダには見つかりませんでした。<a href="#" id="toAll">すべて（${base.length}件）を見る</a></p>`
        : '<p class="muted">見つかりませんでした。</p>';
      return;
    }
    const card = m => `
        <a class="item" href="view.html?id=${encodeURIComponent(m.id)}">
          ${FM.thumbHtml(m)}
          <div class="grow">
            <div><span class="chip-store">${FM.esc(m.store)}</span><strong>${FM.esc(m.title)}</strong></div>
            <div>${FM.tagsHtml(m.tags)}</div>
          </div>
        </a>`;
    if (curFolder) { $('list').innerHTML = hit.map(card).join(''); return; }
    // 「すべて」のときはフォルダごとにまとめる
    const groups = {};
    hit.forEach(m => { const k = m.folder || 'フォルダなし'; (groups[k] = groups[k] || []).push(m); });
    const keys = order(Object.keys(groups), folders.concat(['フォルダなし'])); // 自分で並べた順
    $('list').innerHTML = keys.map(k => `
      <div class="folder-head">📁 ${FM.esc(k)} <span class="count">${groups[k].length}</span></div>
      ${groups[k].map(card).join('')}`).join('');
  }

  function setFolder(f) {
    curFolder = f; FM.store.set('fFolder', f); render();
    const on = $('folderTabs').querySelector('button.on');
    if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
  $('folderTabs').addEventListener('click', e => {
    if (dragJustEnded) { e.preventDefault(); return; }
    const b = e.target.closest('button[data-folder]'); if (b) setFolder(b.dataset.folder);
  });

  /* ---------- フォルダのタブを長押しして、横にずらして並べ替える ---------- */
  const bar = $('folderTabs');
  let press = null, drag = null, dragJustEnded = false;
  function startPress(x, y, target) {
    const b = target.closest && target.closest('button.movable');
    if (!b) return;
    press = { b, x, y, timer: setTimeout(() => beginDrag(b, x), 450) };
  }
  function cancelPress() { if (press) { clearTimeout(press.timer); press = null; } }
  // 動かしているタブは指についてくる。ほかのタブは、空いた場所へなめらかに押しのけられる
  const cx = clientX => clientX - bar.getBoundingClientRect().left + bar.scrollLeft; // タブの列の中での位置
  function beginDrag(b, x) {
    press = null;
    const items = Array.from(bar.querySelectorAll('button.movable'));
    const br = bar.getBoundingClientRect();
    const slots = items.map(el => { const r = el.getBoundingClientRect(); return { el, left: r.left - br.left + bar.scrollLeft, width: r.width }; });
    const from = items.indexOf(b);
    const gap = slots.length > 1 ? (slots[1].left - slots[0].left - slots[0].width) : 6;
    drag = { b, items, slots, from, to: from, gap, startX: cx(x), lastClient: x, raf: 0 };
    items.forEach(el => { el.style.transition = el === b ? 'none' : 'transform .22s cubic-bezier(.2,.8,.2,1)'; });
    b.classList.add('dragging');
    bar.classList.add('sorting');
    try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
    const loop = () => { if (!drag) return; edgeScroll(); layout(); drag.raf = requestAnimationFrame(loop); };
    drag.raf = requestAnimationFrame(loop);
  }
  function layout() {
    const d = drag;
    const dx = cx(d.lastClient) - d.startX;
    const me0 = d.slots[d.from];
    // 端より外へは行かせない
    const minDx = d.slots[0].left - me0.left, last = d.slots[d.slots.length - 1];
    const maxDx = last.left + last.width - (me0.left + me0.width);
    const mdx = Math.max(minDx - 20, Math.min(maxDx + 20, dx));
    d.b.style.transform = `translateX(${mdx}px) scale(1.08)`;
    // 中心がどのタブの中心を越えたかで、入る場所を決める
    const center = me0.left + me0.width / 2 + mdx;
    let to = 0;
    d.slots.forEach((sl, i) => { if (i !== d.from && sl.left + sl.width / 2 < center) to++; });
    d.to = to;
    const shift = me0.width + d.gap;
    d.slots.forEach((sl, i) => {
      if (i === d.from) return;
      let t = 0;
      if (d.from < to && i > d.from && i <= to) t = -shift;
      else if (d.from > to && i < d.from && i >= to) t = shift;
      sl.el.style.transform = t ? `translateX(${t}px)` : '';
    });
  }
  function edgeScroll() {
    const br = bar.getBoundingClientRect(), x = drag.lastClient;
    if (x < br.left + 44) bar.scrollLeft -= Math.ceil((br.left + 44 - x) / 4);
    else if (x > br.right - 44) bar.scrollLeft += Math.ceil((x - (br.right - 44)) / 4);
  }
  function moveDrag(x) { if (drag) drag.lastClient = x; }
  function endDrag() {
    if (!drag) return;
    const d = drag; drag = null;
    cancelAnimationFrame(d.raf);
    // 入る場所へすっと収める
    const order = d.items.slice(); order.splice(d.from, 1); order.splice(d.to, 0, d.b);
    let target = d.slots[0].left;
    for (let i = 0; i < d.to; i++) target += order[i].getBoundingClientRect().width + d.gap;
    d.b.style.transition = 'transform .18s ease-out';
    d.b.style.transform = `translateX(${target - d.slots[d.from].left}px)`;
    dragJustEnded = true; setTimeout(() => { dragJustEnded = false; }, 400);
    setTimeout(() => {
      d.b.classList.remove('dragging');
      bar.classList.remove('sorting');
      myOrder = order.map(el => el.dataset.folder);
      FM.store.set('folderOrder', myOrder);
      FM.store.set('dragHintSeen', true);
      const keep = bar.scrollLeft;
      applyMyOrder();
      render(); // 並べ直して描き直す（タブはまっさらになる）
      bar.scrollLeft = keep;
      if (d.from !== d.to && me.mode === 'line') FM.api('saveFolderOrder', { order: myOrder }).catch(() => FM.toast('並び順を保存できませんでした', true));
    }, 190);
  }
  // スマホ（指）
  bar.addEventListener('touchstart', e => { const t = e.touches[0]; startPress(t.clientX, t.clientY, e.target); }, { passive: true });
  bar.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (drag) { e.preventDefault(); moveDrag(t.clientX); return; }
    if (press && (Math.abs(t.clientX - press.x) > 8 || Math.abs(t.clientY - press.y) > 8)) cancelPress(); // ふつうの横スクロール
  }, { passive: false });
  bar.addEventListener('touchend', () => { cancelPress(); endDrag(); });
  bar.addEventListener('touchcancel', () => { cancelPress(); endDrag(); });
  bar.addEventListener('contextmenu', e => { if (press || drag) e.preventDefault(); });
  // パソコン（マウス）
  bar.addEventListener('mousedown', e => startPress(e.clientX, e.clientY, e.target));
  window.addEventListener('mousemove', e => {
    if (drag) { e.preventDefault(); moveDrag(e.clientX); return; }
    if (press && (Math.abs(e.clientX - press.x) > 8 || Math.abs(e.clientY - press.y) > 8)) cancelPress();
  });
  window.addEventListener('mouseup', () => { cancelPress(); endDrag(); });

  // タグから来たとき（#%23タグ）だけ検索欄に入れる。LINEが付ける #context_token=… などは無視する
  if (location.hash.length > 1) {
    try {
      const h = decodeURIComponent(location.hash.slice(1));
      if (/^[#＃]/.test(h) && h.indexOf('=') < 0) { $('q').value = h; curFolder = ''; }
    } catch (e) {}
  }
  $('q').addEventListener('input', render);
  $('fStore').addEventListener('change', () => { FM.store.set('fStore', $('fStore').value); render(); });
  // タグを押すと、そのタグで検索
  $('list').addEventListener('click', e => {
    if (e.target.id === 'toAll') { e.preventDefault(); setFolder(''); return; }
    const t = e.target.closest('.tag');
    if (!t) return;
    e.preventDefault();
    $('q').value = '#' + t.dataset.tag;
    curFolder = ''; FM.store.set('fFolder', '');
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  render();
  const on0 = $('folderTabs').querySelector('button.on');
  if (on0) on0.scrollIntoView({ inline: 'center', block: 'nearest' });
})();
</script>
</body>
</html>
